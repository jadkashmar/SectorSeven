<!DOCTYPE html>
<html>
<head>
    <title>Session History</title>
</head>
<body>
    <h1>Past Sessions</h1>
    <ul id="sessionList"></ul>

    <h2 id="resultsTitle"></h2>
    <table border="1" id="resultsTable">
        <thead>
            <tr><th>Pos</th><th>Driver</th><th>Team</th><th>Gap</th><th>Best Lap</th><th>Status</th></tr>
        </thead>
        <tbody id="resultsBody"></tbody>
    </table>

    <script>
        async function loadSessions() {
        const res = await fetch('/api/sessions');
        const sessions = await res.json();

        const list = document.getElementById('sessionList');
        sessions.forEach((session) => {
        const li = document.createElement('li');
        const link = document.createElement('a');
        link.href = '#';
        link.textContent = `${session.meeting_name} — ${session.session_name} (${session.status})`;
        link.onclick = () => loadResults(session.session_key, link.textContent);
        li.appendChild(link);
        list.appendChild(li);
        });
        }

        async function loadResults(sessionKey, title) {
        const res = await fetch(`/api/sessions/${sessionKey}/results`);
        const results = await res.json();

        document.getElementById('resultsTitle').textContent = title;
        const tbody = document.getElementById('resultsBody');
        tbody.innerHTML = '';

        results.forEach((row) => {
        const status = row.retired ? 'DNF' : '';
        const tr = document.createElement('tr');
        tr.innerHTML = `
        <td>${row.position}</td>
        <td style="color:#${row.team_colour}">${row.full_name}</td>
        <td>${row.team_name}</td>
        <td>${row.gap_to_leader}</td>
        <td>${row.best_lap_time}</td>
        <td>${status}</td>
        `;
        tbody.appendChild(tr);
        });
        }

        loadSessions();
    </script>
</body>
</html>
