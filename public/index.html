<!DOCTYPE html>
<html>
<head>
    <title>F1 Live Standings</title>
</head>
<body>
    <h1 id="sessionTitle">Loading session...</h1>
    <table border="1" id="standingsTable">
        <thead>
            <tr>
                <th>Pos</th>
                <th>Driver</th>
                <th>Team</th>
                <th>Gap</th>
                <th>Interval</th>
            </tr>
        </thead>
        <tbody id="standingsBody">
        </tbody>
    </table>

    <script>
        let drivers = {};

        const source = new EventSource('/api/live');

        source.onmessage = (event) => {
        const { type, payload } = JSON.parse(event.data);

        if (type === 'drivers') {
        payload.forEach((driver) => {
        drivers[driver.number] = driver;
        });
        }

        if (type === 'sessionInfo') {
        document.getElementById('sessionTitle').textContent =
        `${payload.meetingName} — ${payload.sessionName} (${payload.status})`;
        }

        if (type === 'timingData') {
        renderStandings(payload);
        }
        };

        function renderStandings(timingData) {
        const tbody = document.getElementById('standingsBody');
        tbody.innerHTML = '';

        timingData.forEach((row) => {
        const driver = drivers[row.number];
        const tr = document.createElement('tr');
        tr.innerHTML = `
        <td>${row.position}</td>
        <td style="color: ${driver ? driver.color : '#000'}">${driver ? driver.name : row.number}</td>
        <td>${driver ? driver.team : ''}</td>
        <td>${row.gapToLeader}</td>
        <td>${row.intervalAhead}</td>
        `;
        tbody.appendChild(tr);
        });
        }
    </script>
</body>
</html>
