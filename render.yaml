# Render "Blueprint" — deploy with New > Blueprint, pointing at this repo.
# Builds from the root Dockerfile.
#
# No persistent disk here — Render's free tier doesn't support them. That's
# fine: the live-timing feature is entirely in-memory (WebSocket feed -> SSE
# broadcast), it doesn't touch the database. Only /api/sessions and past
# session results/standings depend on f1data.db, and those just reset
# whenever the free instance restarts (docker-entrypoint.sh's /data symlink
# trick simply never activates without a mounted volume, so this is a no-op
# change on hosts that DO have a disk — e.g. Render Starter+, Railway,
# Fly.io — if you upgrade later).
services:
  - type: web
    name: sectorseven-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
